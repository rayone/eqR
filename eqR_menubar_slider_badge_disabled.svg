<svg xmlns="http://www.w3.org/2000/svg"
     width="18" height="18" viewBox="0 0 18 18" fill="none">
  <title>eqR macOS menubar icon disabled</title>
  <desc>Disabled circular equalizer control icon for the eqR macOS menubar app.</desc>

  <!-- Transparent background; vector-only geometry -->
  <g stroke="#000000" stroke-linecap="round" stroke-linejoin="round" opacity="0.42">
    <!-- outer badge -->
    <circle cx="9" cy="9" r="7.2" stroke-width="1.6"/>

    <!-- left slider -->
    <path d="M5.1 4.0V5.4" stroke-width="1.2"/>
    <path d="M5.1 8.6V14.0" stroke-width="1.2"/>
    <circle cx="5.1" cy="7.0" r="1.6" stroke-width="1.2"/>

    <!-- center slider -->
    <path d="M9.0 4.0V8.4" stroke-width="1.2"/>
    <path d="M9.0 11.6V14.0" stroke-width="1.2"/>
    <circle cx="9.0" cy="10.0" r="1.6" stroke-width="1.2"/>

    <!-- right slider -->
    <path d="M12.9 4.0V5.1" stroke-width="1.2"/>
    <path d="M12.9 8.3V14.0" stroke-width="1.2"/>
    <circle cx="12.9" cy="6.7" r="1.6" stroke-width="1.2"/>
  </g>
</svg>
